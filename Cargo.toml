[package]
name = "architect"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.20"
libc = "0.2.189"

toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

schemars = "=1.2.2"

[dev-dependencies]
tempfile = "3"
