[package]
name = "antislop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "architect"

[[bin]]
name = "antislop"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.20"
libc = "0.2.189"

toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

schemars = "=1.2.2"

ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

# The daemon is the frontend's own executable, so `cargo run` starts a debug
# daemon. Optimize dependencies (serde_json, sha2, SQLite) even in debug builds.
[profile.dev.package."*"]
opt-level = 3
