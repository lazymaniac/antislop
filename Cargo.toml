[package]
name = "antislop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[[bin]]
name = "antislop"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.20"
libc = "0.2.189"

toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["serde"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
toml_edit = "0.25.17"
portable-pty = "0.9"
wezterm-term = { package = "zeughaus-wezterm-term", version = "0.1" }
tungstenite = "0.30"
ureq = { version = "3.5", default-features = false, features = ["json"] }
tiny_http = "0.12"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

tempfile = "3"

# The daemon is the frontend's own executable, so `cargo run` starts a debug
# daemon. Optimize dependencies (serde_json, sha2, SQLite) even in debug builds.
[profile.dev.package."*"]
opt-level = 3
