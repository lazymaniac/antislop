# Local routing: Codex orchestrates; OpenCode via oMLX executes and verifies.
schema_version = 1

[workspace]
mode = "in-place"

[policy]
mode = "supervised"
revision = 1
local_write = true
local_checks = true
local_commits = true

[providers.codex]
binary = "/opt/homebrew/bin/codex"
isolation = "read_only"

[providers.agy]
binary = "/Users/sebastian/.local/bin/agy"
isolation = "tool_free"

[providers.opencode]
command = ["omlx", "launch", "opencode", "--model", "Qwen3.8-Flash-Next-Uncensored-oQ5e-mtp", "--"]
isolation = "read_only"

[role_providers]
orchestrator = ["codex"]
executor = ["opencode"]
verifier = ["opencode"]

[profiles.orchestrator]
provider = "codex"
effort = "deep"
work_kinds = ["orchestration"]
roles = ["orchestrator"]

[profiles.reasoning]
provider = "opencode"
model = "omlx/Qwen3.8-Flash-Next-Uncensored-oQ5e-mtp"
effort = "deep"
work_kinds = ["context", "requirements", "options", "planning", "architecture", "dependencies", "security", "performance", "analysis"]
roles = ["executor"]

[profiles.execution]
provider = "opencode"
model = "omlx/Qwen3.8-Flash-Next-Uncensored-oQ5e-mtp"
effort = "deep"
work_kinds = ["implementation", "refactoring", "static_analysis", "test_design", "testing", "integration", "research", "writing", "delivery"]
roles = ["executor"]

[profiles.review]
provider = "opencode"
model = "omlx/Qwen3.8-Flash-Next-Uncensored-oQ5e-mtp"
effort = "deep"
work_kinds = ["orchestration", "context", "requirements", "options", "planning", "architecture", "dependencies", "implementation", "refactoring", "static_analysis", "test_design", "testing", "security", "performance", "integration", "research", "writing", "analysis", "delivery"]
roles = ["verifier"]

# Every task kind has a dedicated verifier assignment. Runtime creates separate
# verifier agents/sessions; a shared profile never means a shared verifier agent.
[routing.context]
executor = "reasoning"
verifier = "review"
[routing.requirements]
executor = "reasoning"
verifier = "review"
[routing.options]
executor = "reasoning"
verifier = "review"
[routing.planning]
executor = "reasoning"
verifier = "review"
[routing.architecture]
executor = "reasoning"
verifier = "review"
[routing.dependencies]
executor = "reasoning"
verifier = "review"
[routing.implementation]
executor = "execution"
verifier = "review"
[routing.refactoring]
executor = "execution"
verifier = "review"
[routing.static_analysis]
executor = "execution"
verifier = "review"
[routing.test_design]
executor = "execution"
verifier = "review"
[routing.testing]
executor = "execution"
verifier = "review"
[routing.security]
executor = "reasoning"
verifier = "review"
[routing.performance]
executor = "reasoning"
verifier = "review"
[routing.integration]
executor = "execution"
verifier = "review"
[routing.research]
executor = "execution"
verifier = "review"
[routing.writing]
executor = "execution"
verifier = "review"
[routing.analysis]
executor = "reasoning"
verifier = "review"
[routing.delivery]
executor = "execution"
verifier = "review"

[orchestrator]
profile = "orchestrator"

[routing.orchestration]
executor = "orchestrator"
verifier = "review"
