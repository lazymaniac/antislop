name: Checks
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 scripts/requirements.py --check
      - run: python3 scripts/audit_requirements.py --check
      - run: python3 scripts/requirements_gaps.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo build --locked
      - run: python3 scripts/demo.py
      - run: python3 scripts/demo.py --reject
