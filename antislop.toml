# Codex Sol 6.1 handles orchestration and planning; Unsloth Pi handles tasks.
schema_version = 5

[policy]
local_commits = true

[providers.pi]
command = ["unsloth", "start", "pi", "--model", "unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL", "--context-length", "200000"]

[profiles.pi]
provider = "pi"
effort = "high"

[orchestrator]
profile = "pi"

[routing.requirements]
executor = "pi"
reviewer = "pi"

[routing.options]
executor = "pi"
reviewer = "pi"

[routing.planning]
executor = "pi"
reviewer = "pi"

[routing.architecture]
