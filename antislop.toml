# Local routing: Codex Sol 6.1 orchestrates; Codex Luna executes and verifies.
schema_version = 2


[policy]
mode = "supervised"
local_write = true
local_commits = true

[providers.codex]
command = ["codex", "--sandbox", "danger-full-access"]

[providers.agy]
binary = "agy"

[providers.claude]
binary = "claude"

[providers.opencode]
command = ["omlx", "launch", "opencode", "--model", "Qwen3.8-Flash-Next-Uncensored-oQ5e-mtp", "--"]

# Profiles select the provider, optional model and reasoning effort.
# Effort: low, medium, high, xhigh (availability depends on the selected model).
[profiles.orchestrator]
provider = "codex"
model = "gpt-6.1-sol"
effort = "low"

[profiles.reasoning]
provider = "codex"
model = "gpt-6-luna"
effort = "high"

[profiles.execution]
provider = "codex"
model = "gpt-6-luna"
effort = "high"

[profiles.review]
provider = "codex"
model = "gpt-6-luna"
effort = "high"

# Every task kind has a dedicated verifier assignment. Runtime creates separate
# verifier agents/sessions; a shared profile never means a shared verifier agent.
[routing.context]
executor = "reasoning"
verifier = "review"
[routing.requirements]
executor = "reasoning"
verifier = "review"
[routing.options]
executor = "reasoning"
verifier = "review"
[routing.planning]
executor = "reasoning"
verifier = "review"
[routing.architecture]
executor = "reasoning"
verifier = "review"
[routing.dependencies]
executor = "reasoning"
verifier = "review"
[routing.implementation]
executor = "execution"
verifier = "review"
[routing.refactoring]
executor = "execution"
verifier = "review"
[routing.static_analysis]
executor = "execution"
verifier = "review"
[routing.test_design]
executor = "execution"
verifier = "review"
[routing.testing]
executor = "execution"
verifier = "review"
[routing.security]
executor = "reasoning"
verifier = "review"
[routing.performance]
executor = "reasoning"
verifier = "review"
[routing.integration]
executor = "execution"
verifier = "review"
[routing.research]
executor = "execution"
verifier = "review"
[routing.writing]
executor = "execution"
verifier = "review"
[routing.analysis]
executor = "reasoning"
verifier = "review"
[routing.delivery]
executor = "execution"
verifier = "review"

[orchestrator]
profile = "orchestrator"

[routing.orchestration]
executor = "orchestrator"
verifier = "review"
