# Example: Codex orchestrates; Antigravity (agy) works and verifies.
# Copy to your project as architect.toml and adjust binaries and models.
# Supported CLIs: codex, agy, claude. Each task kind names a worker profile
# and a verifier profile; every verifier gets its own session.
schema_version = 1

[workspace]
mode = "task-worktrees"

# supervised: you accept every plan. autonomous: a checked plan runs on its own.
# local_write lets workers change files (in their own worktrees); with
# local_commits each approved change is committed on your branch, otherwise it
# is left as uncommitted changes in the project.
[policy]
mode = "supervised"
revision = 1
local_write = true
local_checks = true
local_commits = false

[providers.codex]
binary = "codex"
isolation = "read_only"
native_effort = true
[providers.codex.effort_map]
light = "low"
standard = "medium"
deep = "high"

[providers.agy]
binary = "agy"
isolation = "tool_free"
native_effort = true
[providers.agy.effort_map]
light = "low"
standard = "medium"
deep = "high"

[role_providers]
orchestrator = ["codex"]
executor = ["agy"]
verifier = ["agy"]

[profiles.orchestrator]
provider = "codex"
effort = "deep"
work_kinds = ["orchestration"]
roles = ["orchestrator"]

[profiles.reasoning]
provider = "agy"
effort = "deep"
work_kinds = ["context", "requirements", "options", "planning", "architecture", "dependencies", "security", "performance", "analysis"]
roles = ["executor"]

[profiles.execution]
provider = "agy"
effort = "deep"
work_kinds = ["implementation", "refactoring", "static_analysis", "test_design", "testing", "integration", "research", "writing", "delivery"]
roles = ["executor"]

[profiles.review]
provider = "agy"
effort = "deep"
work_kinds = ["orchestration", "context", "requirements", "options", "planning", "architecture", "dependencies", "implementation", "refactoring", "static_analysis", "test_design", "testing", "security", "performance", "integration", "research", "writing", "analysis", "delivery"]
roles = ["verifier"]

# Every task kind has a dedicated verifier assignment. Runtime creates separate
# verifier agents/sessions; a shared profile never means a shared verifier agent.
[routing.context]
executor = "reasoning"
verifier = "review"
[routing.requirements]
executor = "reasoning"
verifier = "review"
[routing.options]
executor = "reasoning"
verifier = "review"
[routing.planning]
executor = "reasoning"
verifier = "review"
[routing.architecture]
executor = "reasoning"
verifier = "review"
[routing.dependencies]
executor = "reasoning"
verifier = "review"
[routing.implementation]
executor = "execution"
verifier = "review"
[routing.refactoring]
executor = "execution"
verifier = "review"
[routing.static_analysis]
executor = "execution"
verifier = "review"
[routing.test_design]
executor = "execution"
verifier = "review"
[routing.testing]
executor = "execution"
verifier = "review"
[routing.security]
executor = "reasoning"
verifier = "review"
[routing.performance]
executor = "reasoning"
verifier = "review"
[routing.integration]
executor = "execution"
verifier = "review"
[routing.research]
executor = "execution"
verifier = "review"
[routing.writing]
executor = "execution"
verifier = "review"
[routing.analysis]
executor = "reasoning"
verifier = "review"
[routing.delivery]
executor = "execution"
verifier = "review"

[orchestrator]
profile = "orchestrator"

[routing.orchestration]
executor = "orchestrator"
verifier = "review"
