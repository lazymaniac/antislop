# Example: Codex orchestrates; Antigravity (agy) works and reviews.
# Copy to your project as antislop.toml and adjust binaries and models.
# Supported CLIs: codex, agy, claude, gemini, opencode. Each task kind names a worker profile
# and a reviewer profile; every reviewer gets its own session.
schema_version = 4

# Every writer uses an isolated Git worktree. Reviewed changes are integrated
# through the runtime; direct writes in the primary checkout are unsupported.

# Full access and automatic progression are always enabled.
# These policy settings select quality checks and delivery behavior.
[policy]
local_commits = true
# Plans that change code always get the static analysis, testing and
# integration gates they lack from the predefined agent pool.
required_gates = true
# Every writer gets a options task that compares approaches first.
# Turn it off for mechanical work where the comparison decides nothing.
local_options = true

[providers.codex]
binary = "codex"

[providers.agy]
binary = "agy"

# Enable this provider to use the Claude profile example below.
# [providers.claude]
# binary = "claude"

# To use OpenCode via oMLX, configure this provider and set worker/reviewer
# profile providers to "opencode". Pin --model to avoid
# the launcher's interactive model picker; -- forwards the remaining CLI flags.
# [providers.opencode]
# command = ["omlx", "launch", "opencode", "--model", "YOUR_MODEL", "--"]
# Set profile model = "omlx/YOUR_MODEL" to pin the OpenCode model per turn.

# Profiles select the provider, optional model and reasoning effort.
# A profile is reusable settings, not a running agent or a workflow stage.
# Names such as reasoning and execution are arbitrary: [routing.*] chooses
# profiles for each work kind; [orchestrator].profile selects the conversation
# orchestrator. These assignments also determine the role for each turn;
# profiles do not repeat work kinds or roles.
# The split below lets you tune analysis, execution and review separately,
# even when several profiles use the same provider, model and effort.
# Set model in each profile, not in [providers.*]. Uncomment a model line below
# to select it explicitly. Without model, Antislop sends no model override and
# the CLI chooses its default. Profiles using the same CLI can select different
# models. Availability depends on your account and installed CLI version.
#
# Find the model identifiers available to you:
# - Codex: start codex and open /model; use the model ID in this file.
# - Claude: start claude and open /model. Aliases sonnet, opus and haiku follow
#   the CLI's current mapping; a full ID such as claude-sonnet-5-5 pins a version.
# - Antigravity: run agy models and copy a slug from the first column.
#
# Model examples reviewed against provider documentation on 2026-10-21:
# https://learn.chatgpt.com/docs/models
# https://code.claude.com/docs/en/model-config
# https://antigravity.google/docs/cli/headless/
# Effort: low, medium, high, xhigh (availability depends on the selected model).

# orchestrator: talks to the user, explores context, proposes task plans and
# dependencies, coordinates the team and summarizes results. It runs read-only;
# workers execute the plan. Selected by [orchestrator].profile below.
[profiles.orchestrator]
provider = "codex"
# model = "gpt-6.1-sol"
effort = "high"

# reasoning: worker settings for understanding and deciding: context gathering,
# requirements, comparing options, planning, architecture, dependencies,
# security/performance analysis and general analysis. This is an executor role:
# it produces the task's result, which is then checked by a separate reviewer.
[profiles.reasoning]
provider = "agy"
# model = "gemini-4-argon-high"
effort = "high"

# execution: worker settings for producing and checking deliverables:
# implementation, refactoring, static analysis, test design/execution,
# integration, research, writing and delivery. Like reasoning, it is an
# executor. Every role has full access; the profile name
# itself does not grant it. Writers always work in isolated task worktrees.
[profiles.execution]
provider = "agy"
# model = "gemini-3.8-flash-high"
effort = "high"

# review: reviewer settings for checking plans and task results against their
# goals, risks and required checks. Reviewers run read-only and approve the
# result or return findings for correction. Each review uses its own
# session, separate from the worker, even if both profiles use the same model.
# This example routes every work kind to review, including plan review
# through [routing.orchestration].reviewer.
# To use Claude for review, enable [providers.claude] above and replace this
# profile's provider/model with either pair:
# provider = "claude"
# model = "claude-sonnet-5-5"
# Or use provider = "claude" with model = "claude-opus-5-5".
# You can also use model = "sonnet" or model = "opus" to follow a CLI alias.
[profiles.review]
provider = "agy"
# model = "gemini-3.8-flash-medium"
effort = "medium"

# Routing maps a task's kind to profile names from [profiles.*]:
# - executor selects the worker that produces the result or changes files.
# - reviewer selects the independent reviewer that checks that result and
#   approves it or returns findings for correction. It runs read-only in its
#   own session, even when executor and reviewer name the same profile.
# Values are profile names, not CLI names: executor = "reasoning" uses
# [profiles.reasoning], including its provider, model and effort.
# In this example, reasoning handles analysis/decisions, execution handles
# deliverables/checks, and review reviews every kind. Each assignment can be
# changed independently, e.g. reviewer = "execution" reuses that profile's
# settings for a reviewer turn; it does not give the reviewer write access.
#
# The orchestrator chooses task kinds in its plan. These tables select settings
# when such tasks run; they do not create tasks or impose the order listed here.
# Work kind also selects the domain-specific reviewer checklist described below.

# context: Read relevant code/docs and identify contracts, conventions and unknowns.
# Reviewer checks: Review that claims come from files read and that important context is covered.
[routing.context]
executor = "reasoning"
reviewer = "review"

# requirements: Extract requirements, constraints and acceptance criteria from the request.
# Reviewer checks: Review completeness, qualifiers and any conflicting requirements.
[routing.requirements]
executor = "reasoning"
reviewer = "review"

# options: Compare feasible solutions and justify the choice against the requirements.
# Reviewer checks: Review that alternatives face the same criteria and evidence supports the choice.
[routing.options]
executor = "reasoning"
reviewer = "review"

# planning: Break work into tasks with clear goals, dependencies and completion criteria.
# Reviewer checks: Review requirement coverage, dependency order and explicit handling of unknowns.
# The planner drafts every plan with this executor profile; tasks of kind
# planning use it too. The orchestrator profile revises the plan afterwards.
[routing.planning]
executor = "orchestrator"
reviewer = "review"

# architecture: Design module boundaries, interfaces and data flow within the existing project.
# Reviewer checks: Review fit with existing conventions and that every added layer is necessary.
[routing.architecture]
executor = "reasoning"
reviewer = "review"

# dependencies: Evaluate libraries, versions and licensing obligations for dependencies.
# Reviewer checks: Review maintenance, existing alternatives and licenses of the actual dependency graph.
[routing.dependencies]
executor = "reasoning"
reviewer = "review"

# implementation: Implement the requested behavior and leave touched code in good shape.
# Reviewer checks: Review requirements, edge cases, conventions and meaningful tests of the change.
[routing.implementation]
executor = "execution"
reviewer = "review"

# refactoring: Improve existing code structure while preserving its behavior.
# Reviewer checks: Review behavior preservation and concrete simplification rather than cosmetic edits.
[routing.refactoring]
executor = "execution"
reviewer = "review"

# static_analysis: Run project linters, compiler checks and other static analyzers.
# Reviewer checks: Review actual runs and warnings, including findings hidden by exit code 0 or suppressions.
[routing.static_analysis]
executor = "execution"
reviewer = "review"

# test_design: Design scenarios and assertions from requirements and likely failures.
# Reviewer checks: Review edge cases and combinations of inputs that can interact.
[routing.test_design]
executor = "execution"
reviewer = "review"

# testing: Implement/run tests of the real code paths and reproduce regressions.
# Reviewer checks: Review observed results and assertions that would fail on the targeted defect.
[routing.testing]
executor = "execution"
reviewer = "review"

# security: Examine trust boundaries, relevant threats and security weaknesses.
# Reviewer checks: Review findings are reproducible and fixes close the issue without new exposure.
[routing.security]
executor = "reasoning"
reviewer = "review"

# performance: Investigate runtime/memory costs and measure proposed optimizations.
# Reviewer checks: Review representative benchmarks, a comparable baseline and unchanged behavior.
[routing.performance]
executor = "reasoning"
reviewer = "review"

# integration: Check combined changes together across module boundaries and project checks.
# Reviewer checks: Review the whole result builds, contracts agree and regressions are covered.
[routing.integration]
executor = "execution"
reviewer = "review"

# research: Investigate external facts, tools or approaches using relevant sources.
# Reviewer checks: Review sources exist, support each claim and are current enough for the question.
[routing.research]
executor = "execution"
reviewer = "review"

# writing: Produce documentation, explanations or other requested written material.
# Reviewer checks: Review factual accuracy, consistency and compliance with the brief.
[routing.writing]
executor = "execution"
reviewer = "review"

# analysis: Analyze data, behavior or a problem and present supported conclusions.
# Reviewer checks: Review assumptions, independently recompute results and check reproducibility.
[routing.analysis]
executor = "reasoning"
reviewer = "review"

# delivery: Prepare the handoff: results, usage instructions, limitations and open risks.
# Reviewer checks: Review the report matches completed work and its instructions work.
[routing.delivery]
executor = "execution"
reviewer = "review"

[orchestrator]
profile = "orchestrator"

# orchestration: Coordinate the conversation/team and propose the overall task plan.
# Reviewer checks: Review plan coverage, dependency order and checkable task goals.
# Special case: executor must match [orchestrator].profile. The reviewer
# profile selects the separate plan reviewer; this is not an ordinary worker task.
[routing.orchestration]
executor = "orchestrator"
reviewer = "review"
